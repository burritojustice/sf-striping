# Every Monday (and on demand): rebuild the diagram list from SFMTA's index, then render images for
# new or changed diagrams. Images are committed in batches, so a long first run keeps its progress.
name: Refresh striping diagrams
on:
  schedule:
    - cron: "17 13 * * 1"     # Mondays, 6:17 am Pacific
  workflow_dispatch:
    inputs:
      limit:
        description: "Only render this many diagrams (0 = all); for testing"
        default: "0"
permissions:
  contents: write
concurrency: { group: refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONUNBUFFERED: "1"
      STRIPING_HI_WIDTH: "3000"   # zoomable image width
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils && pip install pillow
      - run: |
          git config user.name "striping-bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Rebuild data/striping.json and the review list (and log what changed)
        run: |
          python3 scripts/build_striping.py
          for f in data/striping.json data/striping_review.csv data/striping_changes.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -q -m "Refresh striping diagram list $(date -u +%Y-%m-%d)"
            git pull -q --rebase && git push -q
          fi
      - name: Render images for new or changed diagrams
        run: python3 scripts/render.py --commit-every 200 --limit "${{ github.event.inputs.limit || '0' }}"
